# A generic line-oriented configuration, for an installer that has its own format.
#
# `.cfg` is the catch-all for anything whose file is a list of directives and which this
# server has no reason to understand: it is stored, layered by concatenation, and served
# verbatim. Endpoint: /cfg/<anything>.
#
# The rules for `.ks` and `.preseed` apply here too — ordinary comments ARE served, only
# `# answer:` lines are stripped, and a later layer follows rather than overrides.
#
# answer: member 52:54:00:aa:00:03

lang=fr_FR
keymap=fr
timezone=Europe/Paris

# Templating works here like anywhere else, but a group's members have no document of
# their own, so neither the `machine` variable nor a request fact is available to
# `check`. Careful: a line-oriented document is an opaque string, so a placeholder
# written inside a COMMENT is still a placeholder and still has to resolve. Verify
# templating against a real request instead:
#   rescriptum render --query "path=/cfg/node&mac=52:54:00:aa:00:03"
hostname=node-legacy

install_target=/dev/sda
bootloader=grub2

name: Release

# Only a tag on `main` produces binaries. Pushing to `develop` publishes nothing.
on:
  push:
    tags: ["v*"]
  # Re-runnable by hand if a release job fails after a tag is already pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
      # An SPK version is all-numeric segments, and its last one is a package build
      # number. `verify` requires the tag to equal Cargo.toml, so v0.1.0 can only ever
      # produce 0.1.0-1: a packaging-only fix has no tag to stand on. Bumping this and
      # dispatching by hand attaches rescriptum-0.1.0-2-<abi>.spk to the same Release.
      spk_build:
        description: "SPK build number (bump for a packaging-only repack)"
        required: false
        default: "1"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: check
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          CARGO=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG cargo=$CARGO"
          # A release whose binary reports a different version than its tag is a
          # support problem that outlives the release.
          if [ "$TAG" != "v$CARGO" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi
          echo "version=$CARGO" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The DS416j this was written for. glibc, not musl, and the version is
          # deliberate: Synology's 3.10 kernels answer the time64 syscalls with EINVAL
          # rather than ENOSYS, so musl 1.2 never falls back and every clock call fails.
          - target: armv7-unknown-linux-gnueabihf
            zig_target: armv7-unknown-linux-gnueabihf.2.17
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Zig and cargo-zigbuild
        if: matrix.cross
        run: |
          set -euo pipefail
          ZIG=0.16.0
          curl -fsSL "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked

      - name: Build
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            # zig_target carries the glibc floor where the Rust target cannot.
            cargo zigbuild --release --target "${{ matrix.zig_target || matrix.target }}"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          NAME="rescriptum-${VERSION}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/rescriptum"
          file "$BIN"
          mkdir -p "dist/$NAME"
          cp "$BIN" README.md README.fr.md LICENSE "dist/$NAME/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          # Checksums travel with the archive: whoever runs this as root on their
          # hardware should be able to check what they downloaded.
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 7

  loaders:
    name: Branded iPXE loaders
    needs: verify
    runs-on: ubuntu-latest
    # **Without this the release is incomplete, and quietly so.** A deployment that
    # installs the package gets a TFTP server with nothing to hand out: `boot check`
    # reports three MISSING loaders and every machine the generated DHCP snippet sends
    # here asks for a file, gets nothing, and stops. Until this job existed, "one binary
    # boots an arbitrary machine" was true only for whoever built iPXE themselves.
    #
    # They are a separate download rather than part of any binary archive or `.spk`
    # because they are iPXE and iPXE is GPLv2: separate files served alongside is mere
    # aggregation, and packaging/ipxe/ is the written offer that goes with them.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # iPXE's EFI targets need the architecture's own `ld` and `objcopy`; the BIOS ones
      # build with the host's, and they are 32-bit x86 — which is why this job is amd64
      # and not arm.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential liblzma-dev mtools xorriso isolinux gcc-aarch64-linux-gnu
          aarch64-linux-gnu-ld --version | head -1

      - name: Build them
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          NAME="rescriptum-boot-assets-$VERSION"
          packaging/ipxe/build.sh --out "$GITHUB_WORKSPACE/dist/$NAME"
          cat "$GITHUB_WORKSPACE/dist/$NAME/SHA256SUMS"

      # The same question CI asks of the same script: does the server agree the directory
      # satisfies the table it serves from. A snippet naming a loader that is not here
      # fails silently at the ROM, and this is the only thing that catches it before a
      # release goes out. TFTP off because the question is the file set, not a listener.
      - name: Does the server agree the set is complete?
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          cargo build --release
          RESCRIPTUM_BOOT_DIR="$GITHUB_WORKSPACE/dist/rescriptum-boot-assets-$VERSION" \
          RESCRIPTUM_TFTP_ADDR=off \
          RESCRIPTUM_PUBLIC_HOST=192.0.2.10 \
            ./target/release/rescriptum boot check

      - name: Pack
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          NAME="rescriptum-boot-assets-$VERSION"
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          ( cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: boot-assets
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  package-dsm:
    name: Synology packages
    needs: [verify, build, loaders]
    runs-on: ubuntu-latest
    # Nothing is compiled here: the binaries are already built and statically linked, and
    # an .spk is a release format — the same artifact, wrapped for one platform's package
    # manager. See packaging/dsm/ for why we assemble it ourselves rather than through
    # pkgscripts-ng.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The SPK's CHANGELOG is generated from git log between the previous tag and
          # this one, and Package Center is the only place a DSM user ever sees it.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          SPK_BUILD="${{ inputs.spk_build || '1' }}"
          mkdir -p bins
          # **The loaders go inside the package.** A TFTP server with nothing to hand out
          # boots nothing, and telling a NAS owner to find a second download is how a
          # working appliance becomes a support thread. They are iPXE, GPLv2, separate
          # files never linked into our binary — mere aggregation, and the NOTICE beside
          # them is the written offer that travels with them.
          tar -xzf "artifacts/boot-assets/rescriptum-boot-assets-$VERSION.tar.gz" -C .
          export RESCRIPTUM_LOADERS="$PWD/rescriptum-boot-assets-$VERSION"
          ls "$RESCRIPTUM_LOADERS"
          # One .spk per *build*; the arch line inside each covers the platforms that
          # build serves. aarch64 (arch="armv8") joins this list once the binary has been
          # run on one of its platforms — make-spk.sh already knows the mapping.
          # **The armv7 target here is glibc, and it used to be musl.** When it moved —
          # Synology's 3.10 kernels break musl's time64 fallback — the build matrix above
          # was updated and this line was not, so the job downloaded an artifact that no
          # longer exists and the release died after building all five binaries. The same
          # stale name was still in build.sh, where it silently produced no package at all.
          for pair in "x86_64:x86_64-unknown-linux-musl" "armv7:armv7-unknown-linux-gnueabihf"; do
            abi="${pair%%:*}"; target="${pair#*:}"
            tar -xzf "artifacts/$target/rescriptum-$VERSION-$target.tar.gz" -C bins
            packaging/dsm/make-spk.sh "$abi" \
              --bin "bins/rescriptum-$VERSION-$target/rescriptum" \
              --version "$VERSION" --spk-build "$SPK_BUILD"
          done
          ls -l dist

      - name: Check them structurally
        run: packaging/dsm/check-spk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dsm-packages
          path: dist/*.spk*
          retention-days: 7

  publish:
    name: Publish the release
    needs: [verify, build, loaders, package-dsm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz*' -o -name '*.spk*' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # `gh` is preinstalled on the runner, so this needs no third-party action.
          #
          # A dispatch that repacks — a packaging-only fix shipping as spk_build=2, or a
          # re-run after a job failed — meets a Release that already exists. Uploading
          # into it is the documented path for that, and `gh release create` would fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "rescriptum $TAG" \
              --generate-notes \
              --verify-tag
          fi

name: CI

# `develop` publishes nothing: it runs the gates and stops there. Binaries are produced
# only by a `vX.Y.Z` tag on `main` — see release.yml.
on:
  push:
    branches: [main, develop]
  pull_request:
  # Re-runnable by hand, which the other three workflows already are. Added the day a
  # GitHub Actions outage left a run stuck in `queued` with no jobs: it could not be
  # rerun ("already running"), cancelled ("already completed") or force-cancelled ("not
  # queued yet"), and with no dispatch trigger there was no way to ask for a fresh one
  # short of pushing a commit nobody wanted to write.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failed provisioning run is expensive; a slow CI is not.
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Format, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The smallest build has to keep working, or the NAS target rots unnoticed.
      # Both features off, and then each on its own: the combination that ships is not
      # the only one that has to compile.
      # **The budget that is actually binding: 0 bytes with the feature off.** Asserted on
      # the *output*, never on the exit code — `cargo tree -i` exits 0 printing
      # "nothing to print." when the package is an optional dependency whose feature is
      # off, which is exactly the state being checked, so an exit-code guard would fire
      # whether or not the crate is there.
      - name: The default build must not reach the terminal interface
        run: |
          graph=$(cargo tree -e normal --prefix none --format '{p}')
          if echo "$graph" | grep -qE '^(ratatui|crossterm) '; then
            echo "ratatui or crossterm is in the default dependency graph"; exit 1
          fi
          echo "absent, as it must be"

      # `--all-features` does not cover this: the terminal interface must build for a
      # deployment that wants no boot media either.
      - name: Build the interface without boot media
        run: cargo build --release --no-default-features --features tui

      - name: Build without SQLite or boot media
        run: cargo build --release --no-default-features

      - name: Build with boot media but no SQLite
        run: cargo build --release --no-default-features --features boot

  loaders:
    name: Branded iPXE loaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A C toolchain and the ARM64 cross binutils. iPXE's EFI targets need the
      # architecture's own `ld` and `objcopy`; the BIOS ones build with the host's.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential liblzma-dev mtools xorriso isolinux gcc-aarch64-linux-gnu
          aarch64-linux-gnu-ld --version | head -1

      - name: Build the loaders
        run: packaging/ipxe/build.sh --out "$GITHUB_WORKSPACE/loaders"

      # **The chain of custody.** What the rig boots and what a release publishes have to
      # be the same bytes, never a rebuild of them — a loader rebuilt after the run that
      # proved it is a loader nobody has booted.
      - name: What was built
        run: |
          ls -la "$GITHUB_WORKSPACE/loaders"
          cat "$GITHUB_WORKSPACE/loaders/SHA256SUMS"

      # Ask the server whether the directory satisfies the table it serves from. A
      # snippet naming a loader that is not here fails silently at the ROM, and this is
      # the only thing that catches it.
      # `RESCRIPTUM_TFTP_ADDR=off` because the question here is whether the *directory*
      # satisfies the table, not whether a listener is up: `boot check` also probes the
      # TFTP port, and on a runner where port 69 is neither bound nor bindable that is a
      # problem it would rightly report and wrongly fail this job over. The rig is what
      # proves a loader actually gets handed over.
      - name: Does the server agree the set is complete?
        run: |
          cargo build --release
          RESCRIPTUM_BOOT_DIR="$GITHUB_WORKSPACE/loaders" \
          RESCRIPTUM_TFTP_ADDR=off \
          RESCRIPTUM_PUBLIC_HOST=192.0.2.10 \
            ./target/release/rescriptum boot check

      - uses: actions/upload-artifact@v4
        with:
          name: ipxe-loaders
          path: ${{ github.workspace }}/loaders
          if-no-files-found: error

  rig:
    name: The boot chain, end to end
    runs-on: ubuntu-latest
    # **The tripwire, not the contract.** The dev rig is what decides; this re-proves the
    # BIOS chain on every push without a single real machine. GitHub's runners are
    # somebody else's machines with somebody else's limits, so it is sized so it cannot
    # fail for capacity reasons — BIOS only, TCG, one claimed and one unclaimed client,
    # no OS image, a few minutes. If it ever needs hardware virtualisation to pass, it
    # has grown too big.
    #
    # Runners are x86_64, so this is native rather than the emulation a Mac does — and
    # there is still no /dev/kvm, which is exactly the constraint the rig is built for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the rig
        run: docker build -f packaging/boot-rig/Dockerfile.rig -t rescriptum-rig:one .

      # Four markers: the DHCP handoff answered from our own generated snippet, a loader
      # fetched over TFTP, an unclaimed machine on its own disk, and a claimed machine at
      # its own answer.
      - name: Boot a claimed and an unclaimed machine
        run: |
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
            -e UNCLAIMED_SECONDS=180 -e CLAIMED_SECONDS=180 \
            rescriptum-rig:one bios

      # **Watched failing, in CI as well as by hand.** A green rig that has never been
      # red proves nothing, and the cheapest way to keep that true is to break one link
      # on every run and require the break to show.
      - name: And it must go red when a loader is missing
        run: |
          if docker run --rm --cap-add NET_ADMIN --device /dev/net/tun \
               --entrypoint sh rescriptum-rig:one \
               -c 'rm /srv/boot/ipxe-undionly.kpxe && exec /rig/rig-in-one.sh bios'; then
            echo "the rig passed with a loader missing — it is not testing what it claims" >&2
            exit 1
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # The site is published from `main` by docs.yml; this only gates it. A dead link in
    # published documentation is cheap to prevent and embarrassing to ship.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the public site
        run: npx notabene build --public --out ./_site

      # `lint` checks every internal link against the routes the build actually emitted.
      - name: No broken internal links
        run: npx notabene lint

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # The project's own rule is that adding a dependency needs a reason in the commit
    # message, because this binary runs as root on other people's hardware. Checking those
    # dependencies against the advisory database is the other half of it: a reason to add
    # one is not a reason to keep it.
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: audit-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo-audit
        # Installed directly rather than through a third-party action, for the same reason
        # Zig is below: this toolchain vets a binary people run as root.
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      # `--deny warnings` also fails on an unmaintained or yanked crate, not only on a
      # vulnerability. The tree is clean under it today; when something appears that has no
      # fix, add `--ignore RUSTSEC-…` here with a line saying why, rather than dropping the
      # flag and losing the rest.
      - name: Advisories
        run: cargo audit --deny warnings

  cross:
    name: Cross-compile for the NAS, and package it
    runs-on: ubuntu-latest
    # The packages carry the loaders now, and they come from the job that built them —
    # so this waits rather than rebuilding iPXE a second time.
    needs: loaders
    # This is where a C dependency breaks first: SQLite is compiled from source, and
    # armv7-musl is the least forgiving target we ship. Catching it here beats catching
    # it while cutting a release. The DSM packages are assembled on the same job for the
    # same reason — they wrap these exact binaries and cost a few seconds more.
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add armv7-unknown-linux-gnueabihf
          # The x86_64 musl build is here for the package check below: it runs on the
          # runner, which is what makes "the packaged binary reports the version INFO
          # claims" a real assertion rather than a re-read of the same string.
          rustup target add x86_64-unknown-linux-musl

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cross-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Zig and cargo-zigbuild
        run: |
          set -euo pipefail
          # Fetched directly rather than through a third-party action: this toolchain
          # links the binary people will run as root on their hardware.
          ZIG=0.16.0
          curl -fsSL "https://ziglang.org/download/${ZIG}/zig-x86_64-linux-${ZIG}.tar.xz" -o zig.tar.xz
          mkdir -p "$HOME/zig" && tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked

      # The glibc floor is the point of this build, not an incidental flag: Synology's ARMv7
      # kernels are 3.10 and answer the time64 syscalls with EINVAL rather than ENOSYS, so
      # musl 1.2 never falls back and every clock call fails on the machine this project
      # exists for. glibc on 32-bit uses the time32 syscalls.
      - name: Build
        run: cargo zigbuild --release --target armv7-unknown-linux-gnueabihf.2.17

      - name: It must not need a glibc the NAS does not have
        run: |
          set -euo pipefail
          BIN=target/armv7-unknown-linux-gnueabihf/release/rescriptum
          file "$BIN"
          file "$BIN" | grep -q 'ARM'
          # DSM 7 on armada38x ships glibc 2.20. Asking for anything newer fails at exec
          # time, on the NAS, with an error that names a symbol version and nothing else.
          WANT=$(readelf --dyn-syms "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs at most $WANT"
          [ "$(printf '%s\n' 'GLIBC_2.17' "$WANT" | sort -V | tail -1)" = 'GLIBC_2.17' ]
          echo "size: $(stat -c%s "$BIN") bytes"

      - name: Build x86_64-musl too
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl

      # Packaging breaks on the PR that breaks it, rather than at tag time. This is the
      # cheap half of "does this package work"; the other half is installing it, which
      # only a DSM machine can answer.
      # The loaders the package ships, from the job that already built and verified them
      # — never a rebuild here. What `check-spk.sh` and the lifecycle harness look at has
      # to be the same bytes the `loaders` job proved satisfy the table.
      - uses: actions/download-artifact@v4
        with:
          name: ipxe-loaders
          path: packaging/ipxe/out

      - name: Assemble the DSM packages
        run: |
          set -euo pipefail
          ls packaging/ipxe/out
          packaging/dsm/make-spk.sh armv7
          packaging/dsm/make-spk.sh x86_64

      - name: Check them structurally
        run: packaging/dsm/check-spk.sh

      # Everything the package's *scripts* decide is testable without DSM — the env file
      # written once and only once, the wizard's values and their absence, the service
      # surviving its own start script, the exit codes Package Center reads, an upgrade
      # that must not touch a hand-edited configuration, an uninstall that must not touch
      # the answers. That is where the expensive mistakes live, so it runs on every push.
      # What is left for a real machine is DSM's own machinery: packaging/dsm/vm/.
      - name: Drive the package lifecycle
        run: packaging/dsm/lifecycle-test.sh dist/rescriptum-*-x86_64.spk
